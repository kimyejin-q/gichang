<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>나 사용 설명서</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#F2F5F0;font-family:'Apple SD Gothic Neo','Pretendard',-apple-system,sans-serif;color:#1A2316;}
#app{max-width:430px;margin:0 auto;min-height:100vh;overflow-x:hidden;}
button,input,textarea{font-family:inherit;}
::-webkit-scrollbar{display:none;}
textarea{resize:none;overflow:hidden;}
@keyframes bncDot{0%,80%,100%{transform:translateY(0);opacity:.3}40%{transform:translateY(-6px);opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(32px)}to{opacity:1;transform:translateX(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:scale(1)}}
@keyframes gaugeFlow{from{width:0}to{width:var(--gw)}}
@keyframes pulseBorder{0%,100%{box-shadow:0 0 0 0 rgba(201,59,42,.4)}50%{box-shadow:0 0 0 8px rgba(201,59,42,0)}}
.su{animation:slideUp .32s cubic-bezier(.25,.46,.45,.94) both;}
.si{animation:slideIn .26s cubic-bezier(.25,.46,.45,.94) both;}
.fi{animation:fadeIn .25s ease both;}
.pop{animation:popIn .28s cubic-bezier(.34,1.56,.64,1) both;}
.pulse{animation:pulseBorder 1.5s ease-in-out infinite;}
</style>
</head>
<body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useCallback,useRef,Fragment,createElement:h}=React;

/* ══ 디자인 토큰 ══ */
const C={
  bg:"#F2F5F0",sur:"#FFFFFF",
  p:"#4C6444",pL:"#6B8A62",pT:"#3A4E34",
  ac:"#EBF0E8",bd:"#DDE3D9",
  ink:"#1A2316",sub:"#5C6B57",mu:"#9AAB94",
  red:"#C93B2A",rBg:"#FDF2F0",rBd:"#F5C5BF",
  amb:"#A86D1A",aBg:"#FBF5E8",aBd:"#F0D49A",
  pur:"#5B4A8A",pBg:"#F3F0FA",pBd:"#C9BEE8",
  gld:"#9A6E1E",gBg:"#FFFBEB",gBd:"#FDE68A",
};

/* ══ 상수 ══ */
const ECATS=[
  {g:"기쁨",  c:"#D97706",bg:"#FEF3C7",cellBg:"rgba(251,191,36,.18)", neg:false,ems:["평온","기쁨","황홀","만족","설렘","희망"]},
  {g:"사랑",  c:"#BE185D",bg:"#FCE7F3",cellBg:"rgba(236,72,153,.15)",  neg:false,ems:["사랑","신뢰","감사","따뜻함","애정","그리움"]},
  {g:"두려움",c:"#1D4ED8",bg:"#DBEAFE",cellBg:"rgba(59,130,246,.15)",  neg:true, ems:["두려움","불안","걱정","긴장","공포","초조"]},
  {g:"슬픔",  c:"#4338CA",bg:"#E0E7FF",cellBg:"rgba(99,102,241,.15)",  neg:true, ems:["슬픔","우울","무기력","허무함","외로움","후회"]},
  {g:"분노",  c:"#B91C1C",bg:"#FEE2E2",cellBg:"rgba(239,68,68,.15)",   neg:true, ems:["짜증","답답함","분노","억울함","배신감","불만"]},
  {g:"기대",  c:"#C2410C",bg:"#FFEDD5",cellBg:"rgba(249,115,22,.15)",  neg:false,ems:["기대","흥분","의욕","집중","각성"]},
];
const NEG_EMOS=ECATS.filter(e=>e.neg).flatMap(e=>e.ems);
const EVENTS=["야근","발표/시험","친구와 다툼","가족 갈등","업무 실수","거절당함","외로움","갑작스러운 변화"];
const ACTIONS=["그냥 누워있음","유튜브/넷플릭스","혼자 산책","음악 들음","맥주/술","폭식","친구에게 연락","일기 씀","스트레칭","낮잠"];
const OUTCOMES=[
  {e:"😌",l:"한결 나아짐",s:5},{e:"🙂",l:"조금 나아짐",s:4},
  {e:"😐",l:"그냥 그랬음",s:3},{e:"😔",l:"별로 안 나아짐",s:2},{e:"😞",l:"오히려 더 힘듦",s:1},
];
const WEEKDAYS=["일","월","화","수","목","금","토"];
const LS_KEY="na-manual-v7";
const DFLT={
  records:[],antiManual:[],happyConditions:[],
  attachedItems:[],favoriteSpots:[],favoriteDrinks:[],
  timeCapsules:[],resilienceScore:20,onboarded:false,
};

/* ══ LocalStorage 유틸 ══ */
function loadData(){
  try{const s=localStorage.getItem(LS_KEY);return s?{...DFLT,...JSON.parse(s)}:DFLT;}
  catch{return DFLT;}
}
function saveData(d){
  try{localStorage.setItem(LS_KEY,JSON.stringify(d));}catch{}
}

/* ══ 공용 유틸 ══ */
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const todayISO=new Date().toISOString().slice(0,10);
const dStr=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
function emoMeta(emo){return ECATS.find(c=>c.ems.includes(emo))||{c:C.mu,bg:C.bg,cellBg:C.bg,g:"기타",neg:false};}
function scoreSty(s){
  if(!s)return{color:C.mu,bg:C.bg};
  if(s>=4)return{color:C.pT,bg:C.ac};
  if(s===3)return{color:C.amb,bg:C.aBg};
  return{color:C.red,bg:C.rBg};
}

/* ── 처방 목록 생성 ── */
function buildPxList(d){
  const item=pick(d.attachedItems?.length?d.attachedItems:["소중한 물건"]);
  const spot=pick(d.favoriteSpots?.length?d.favoriteSpots:["좋아하는 장소"]);
  const drink=pick(d.favoriteDrinks?.length?d.favoriteDrinks:["좋아하는 음료"]);
  const hap=pick(d.happyConditions?.length?d.happyConditions:["편안한 것"]);
  return[
    {icon:"✨",t:"'"+item+"'와 함께하는 5분",dc:"'"+item+"'을 손에 쥐어보세요. 그 감촉이 지금으로 데려다 줄 거예요.",ev:"애착 물건 기반"},
    {icon:"🗺",t:spot+" 걷기",dc:"'"+spot+"'까지 걸어가 보세요. 걷는 동안 숨만 세어보세요.",ev:"힐링 장소 기반"},
    {icon:"☕",t:"'"+drink+"' 한 모금",dc:"'"+drink+"'를 천천히 마시며 향에만 집중해보세요.",ev:"행복 음료 기반"},
    {icon:"💚",t:"'"+hap+"' 소환하기",dc:"지금 당장 '"+hap+"'을 실행해보세요.",ev:"행복 조건 기반"},
    {icon:"📝",t:"감정 3줄 쓰기",dc:"지금 느끼는 감정을 단어 3개로만 적어보세요.",ev:"인지행동치료 기반"},
  ];
}

/* ── 과거 성공 기록 매칭 ──
   같은 event OR 같은 emotion 이면서 outcomeScore >= 4 인 최신 기록 반환 */
function findPastWin(records, event, emotion){
  if(!records?.length) return null;
  return [...records]
    .reverse()
    .find(r=>r.outcomeScore>=4&&r.action&&
      ((event&&r.event===event)||(emotion&&r.emotion===emotion)));
}

/* ── 오답 노트 나레이션 ── */
function makeNarration(r,data){
  const item=data.attachedItems?.[0]||null;
  const drink=data.favoriteDrinks?.[0]||null;
  const spot=data.favoriteSpots?.[0]||null;
  const hap=data.happyConditions?.[0]||null;
  const cheatKey=r.action||
    (item?"'"+item+"'에 '"+(drink||"음료")+"' 마시기":
     drink?"'"+drink+"' 마시기":
     spot?"'"+spot+"' 산책":
     hap?"'"+hap+"' 실행":"나만의 처방");
  const altPx=item&&drink?"'"+item+"'에 '"+drink+"' 담아 마시기":
    spot?"'"+spot+"' 10분 산책":hap?"'"+hap+"' 실행":"다른 처방";
  const dateStr=new Date(r.date+"T00:00:00").toLocaleDateString("ko-KR",{month:"long",day:"numeric"});
  const ss=scoreSty(r.outcomeScore);
  const succeeded=(r.outcomeScore||0)>=4;
  const failed=(r.outcomeScore||0)<=2&&r.outcomeScore!=null;
  return{dateStr,cheatKey,altPx,ss,succeeded,failed};
}

/* ══ 공용 Btn ══ */
function Btn({onClick,disabled,full,variant="primary",style:s={},children}){
  const base={border:"none",borderRadius:14,padding:"15px 20px",fontSize:15,fontWeight:700,
    cursor:disabled?"not-allowed":"pointer",transition:"opacity .15s",opacity:disabled?.42:1,
    ...(full?{width:"100%"}:{}),...s};
  const v={
    primary:{background:C.p,color:"#fff"},
    ghost:{background:"transparent",color:C.p,border:"1.5px solid "+C.p},
    soft:{background:C.ac,color:C.pT},
    danger:{background:C.red,color:"#fff"},
  };
  return h("button",{onClick,disabled,style:{...base,...(v[variant]||v.primary)}},children);
}

/* ══ 하단 Nav ══ */
function Nav({page,go}){
  const mk=(...ps)=>h("svg",{width:22,height:22,viewBox:"0 0 24 24",fill:"none",stroke:"currentColor",strokeWidth:2.2,strokeLinecap:"round",strokeLinejoin:"round"},...ps);
  const tabs=[
    {id:"home",lbl:"홈",icon:mk(h("path",{d:"M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"}),h("polyline",{points:"9 22 9 12 15 12 15 22"}))},
    {id:"record",lbl:"기록하기",icon:mk(h("rect",{x:3,y:4,width:18,height:18,rx:2}),h("line",{x1:16,y1:2,x2:16,y2:6}),h("line",{x1:8,y1:2,x2:8,y2:6}),h("line",{x1:3,y1:10,x2:21,y2:10}))},
    {id:"history",lbl:"나의 역사",icon:mk(h("circle",{cx:12,cy:12,r:10}),h("polyline",{points:"12 6 12 12 16 14"}))},
  ];
  return h("div",{style:{position:"sticky",bottom:0,background:C.sur,borderTop:"1px solid "+C.bd,display:"flex",zIndex:100}},
    tabs.map(({id,lbl,icon})=>h("button",{key:id,onClick:()=>go(id),style:{flex:1,padding:"10px 0",background:"none",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:4,color:page===id?C.p:C.mu,transition:"color .15s"}},
      icon,h("span",{style:{fontSize:10,fontWeight:page===id?700:500}},lbl)
    ))
  );
}

/* ══ 통계형 광고 배너 ══ */
const ADS=[
  {emoji:"🍗",brand:"BBQ치킨",stat:"70",context:"수요일 야근 후",product:"황금올리브 치킨",tag:"야근"},
  {emoji:"☕",brand:"스타벅스",stat:"68",context:"발표·시험 직후",product:"아이스 아메리카노",tag:"발표/시험"},
  {emoji:"🍜",brand:"배민 야식",stat:"74",context:"혼자 있는 저녁",product:"혼밥 배달",tag:"외로움"},
  {emoji:"💆",brand:"힐링 마사지",stat:"61",context:"가족 갈등 이후",product:"30분 코스 마사지",tag:"가족 갈등"},
  {emoji:"🛍",brand:"쿠팡 로켓",stat:"65",context:"업무 실수가 있던 날",product:"소확행 쇼핑",tag:"업무 실수"},
];
function AdBanner({event}){

      h("div",{style:{flex:1}},

/* ══ 과거 성공 치트키 카드 ══ */
function PastWinCard({win,onUse}){
  if(!win)return null;
  const ds=new Date(win.date+"T00:00:00").toLocaleDateString("ko-KR",{month:"long",day:"numeric"});
  return h("div",{style:{background:"linear-gradient(135deg,#EBF0E8,#D1FAE5)",border:"1.5px solid "+C.p,borderRadius:16,padding:"14px 16px",marginBottom:12},className:"pop"},
    h("div",{style:{display:"flex",alignItems:"flex-start",gap:10,marginBottom:10}},
      h("span",{style:{fontSize:20,flexShrink:0}},"🏆"),
      h("div",null,
        h("p",{style:{fontSize:10,fontWeight:700,color:C.pT,letterSpacing:".5px",marginBottom:3}},"DATA MATCH · 과거 성공 기록 발견"),
        h("p",{style:{fontSize:13,color:C.ink,lineHeight:1.7,margin:0}},
          h("span",{style:{fontWeight:700,color:C.pT}},ds),
          "에도 이와 같은 상황으로 힘드셨지만, ",
          h("span",{style:{fontWeight:700,color:C.p,background:C.sur,borderRadius:6,padding:"1px 6px",border:"1px solid "+C.bd}},"'"+win.action+"'"),
          "를 통해 ",
          h("span",{style:{fontWeight:700,color:C.pT}},win.outcomeLabel||"성공"),
          "("+win.outcomeScore+"점)으로 극복한 기록이 있어요!"
        )
      )
    ),
    h("button",{onClick:onUse,style:{width:"100%",background:C.p,color:"#fff",border:"none",borderRadius:10,padding:"11px",fontSize:13,fontWeight:700,cursor:"pointer"}},
      "이번에도 '"+win.action+"' 시도하기 →"
    )

/* ══ MoodCalendar ══ */
function MoodCalendar({year,month,records,selDate,onDayClick,showNav,onPrevM,onNextM,isNextDis,highlightToday}){
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const cells=[...Array(firstDay).fill(null),...Array.from({length:daysInMonth},(_,i)=>i+1)];
  while(cells.length%7!==0)cells.push(null);
  const recMap={};
  records.forEach(r=>{const d=(r.date||"").slice(0,10);if(!d)return;if(!recMap[d])recMap[d]=[];recMap[d].push(r);});
  function cellMeta(iso){
    const recs=recMap[iso];if(!recs?.length)return null;
    const last=recs[recs.length-1];const em=emoMeta(last.emotion||"");
    const isSOS=recs.some(r=>r.isSOS);const isNeg=last.emotion?NEG_EMOS.includes(last.emotion):isSOS;
    const score=last.outcomeScore||0;const isWin=isNeg&&score>=4;
    return{em,isSOS,isNeg,isWin,score,last};
  }
  return h("div",null,
    showNav&&h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}},
      h("button",{onClick:onPrevM,style:{width:34,height:34,borderRadius:10,background:C.ac,border:"none",cursor:"pointer",fontSize:16,color:C.p,display:"flex",alignItems:"center",justifyContent:"center"}},"<"),
      h("p",{style:{fontSize:15,fontWeight:800,color:C.ink,margin:0}},year+"년 "+(month+1)+"월"),
      h("button",{onClick:onNextM,disabled:isNextDis,style:{width:34,height:34,borderRadius:10,background:isNextDis?C.bd:C.ac,border:"none",cursor:isNextDis?"not-allowed":"pointer",fontSize:16,color:isNextDis?C.mu:C.p,display:"flex",alignItems:"center",justifyContent:"center"}},">")
    ),
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",marginBottom:4}},
      WEEKDAYS.map((d,i)=>h("div",{key:d,style:{textAlign:"center",fontSize:11,fontWeight:700,color:i===0?"#C93B2A":i===6?"#1D4ED8":C.mu,padding:"3px 0"}},d))
    ),
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}},
      cells.map((d,idx)=>{
        if(!d)return h("div",{key:"e"+idx,style:{aspectRatio:"1"}});
        const iso=dStr(year,month,d);const meta=cellMeta(iso);
        const isSel=selDate===iso;const isToday=iso===todayISO;const isFuture=iso>todayISO;
        const dow=new Date(year,month,d).getDay();
        let cellBg="transparent",cellBdr="none",txtColor;
        txtColor=isFuture?C.bd:dow===0?"#C93B2A":dow===6?"#1D4ED8":C.ink;
        if(isSel){cellBg=C.p;txtColor="#fff";}
        else if(meta){
          if(meta.isWin)cellBg="rgba(52,211,153,.22)";
          else cellBg=meta.em.cellBg;
          if(meta.isSOS)cellBdr="2px solid "+C.red;
        }
        return h("button",{key:iso,onClick:()=>!isFuture&&onDayClick(iso),disabled:isFuture,style:{
          aspectRatio:"1",width:"100%",borderRadius:10,border:isSel?"none":cellBdr,
          cursor:isFuture?"default":"pointer",background:cellBg,color:isSel?"#fff":txtColor,
          fontSize:13,fontWeight:isToday||isSel?800:400,
          outline:highlightToday&&isToday&&!isSel?"2.5px solid "+C.p:"none",outlineOffset:"-2px",
          display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
          gap:2,padding:"3px 2px",transition:"all .15s",
        }},
          h("span",null,d),
          meta&&h("div",{style:{display:"flex",gap:2,alignItems:"center",justifyContent:"center"}},
            meta.isWin&&h("span",{style:{fontSize:8,color:isSel?"rgba(255,255,255,.9)":"#D97706",lineHeight:1}},"★"),
            !meta.isWin&&h("div",{style:{width:4,height:4,borderRadius:"50%",background:isSel?"rgba(255,255,255,.7)":meta.em.c}}),
            meta.isSOS&&h("span",{style:{fontSize:7,lineHeight:1}},"🚨")
          )
        );
      })
    )
  );
}

/* ══════════════════════════════
   SOS 모달 — 5단계 선형 UX
══════════════════════════════ */
function SOSModal({data,onClose,onUpdate}){
  const [phase,setPhase]=useState(1); /* 1~5 */
  const [chosen,setChosen]=useState(null);
  const [score,setScore]=useState(null);
  const [elapsed,setElapsed]=useState(0);
  const [gaugeAnim,setGaugeAnim]=useState(false);

  const px=buildPxList(data);
  const p=chosen!==null?px[chosen]:null;
  const cap=(data.timeCapsules||[]).slice(-1)[0];
  const mins=Math.floor(elapsed/60),secs=elapsed%60;

  const PHASES=5;
  const phaseLabel=["안티 매뉴얼","처방 선택","실행 타이머","피드백","보상"];

  useEffect(()=>{
    if(phase!==3)return;
    const t=setInterval(()=>setElapsed(v=>v+1),1000);
    return()=>clearInterval(t);
  },[phase]);

  const finish=sc=>{
    const newScore=Math.min(100,(data.resilienceScore||20)+(sc>=4?5:sc>=3?2:0));
    const sosRecord={
      date:todayISO,event:"SOS 비상",emotion:"",
      action:p?p.t:"SOS 처방",
      outcomeScore:sc,outcomeLabel:OUTCOMES.find(o=>o.s===sc)?.l||"",
      isSOS:true,
    };
    onUpdate({records:[...(data.records||[]),sosRecord],resilienceScore:newScore});
    setPhase(5);
    setTimeout(()=>setGaugeAnim(true),400);
  };

  const newScore=Math.min(100,(data.resilienceScore||20)+(score>=4?5:score>=3?2:0));

  /* 공통 헤더 */
  const Header=()=>h(Fragment,null,
    h("div",{style:{width:32,height:4,background:C.bd,borderRadius:2,margin:"0 auto 18px"}}),
    /* 단계 진행 바 */
    h("div",{style:{display:"flex",gap:3,marginBottom:16}},
      Array.from({length:PHASES}).map((_,i)=>h("div",{key:i,style:{
        flex:1,height:3,borderRadius:2,
        background:i<phase?C.p:i===phase-1?C.p:C.bd,
        transition:"background .3s",
      }}))
    ),
    h("p",{style:{fontSize:10,fontWeight:700,color:C.mu,letterSpacing:"1px",marginBottom:0}},
      "STEP "+phase+" / "+PHASES+" · "+phaseLabel[phase-1]
    )
  );

  return h("div",{style:{position:"fixed",inset:0,background:"rgba(26,35,22,.65)",zIndex:200,display:"flex",flexDirection:"column",justifyContent:"flex-end"}},
    h("div",{style:{background:C.sur,borderRadius:"24px 24px 0 0",padding:"20px 20px 48px",maxWidth:430,margin:"0 auto",width:"100%",maxHeight:"92vh",overflowY:"auto"},className:"su"},

      /* ── Phase 1: 안티 매뉴얼 경고 ── */
      phase===1&&h("div",{className:"fi"},
        h(Header),
        h("div",{style:{textAlign:"center",marginBottom:20}},
          h("div",{style:{width:72,height:72,borderRadius:"50%",background:C.rBg,border:"3px solid "+C.red,display:"flex",alignItems:"center",justifyContent:"center",fontSize:36,margin:"0 auto 14px"},className:"pulse"},"🛑"),
          h("h2",{style:{fontSize:20,fontWeight:800,color:C.red,margin:0,letterSpacing:"-.3px"}},"먼저 이것만 확인하세요"),
          h("p",{style:{fontSize:13,color:C.sub,marginTop:6}},"힘들 때 반복하는 실수들이에요. 지금만큼은 피해주세요.")
        ),
        (data.antiManual||[]).length>0
          ?h("div",{style:{marginBottom:16}},
              (data.antiManual||[]).map((a,i)=>h("div",{key:i,style:{background:C.rBg,border:"1px solid "+C.rBd,borderRadius:14,padding:"14px 16px",marginBottom:8,display:"flex",gap:12,alignItems:"center"}},
                h("span",{style:{fontSize:22,flexShrink:0}},"⛔"),
                h("div",null,
                  h("p",{style:{fontSize:11,fontWeight:700,color:C.red,margin:"0 0 3px",letterSpacing:".3px"}},"절대 하지 말 것"),
                  h("p",{style:{fontSize:14,fontWeight:700,color:C.ink,margin:0}},a)
                )
              ))
            )
          :h("div",{style:{background:C.ac,borderRadius:14,padding:"18px",textAlign:"center",marginBottom:16}},
              h("p",{style:{fontSize:22,marginBottom:8}},"📝"),
              h("p",{style:{fontSize:14,color:C.sub,lineHeight:1.7}},"아직 금기사항이 없어요.\n'나의 역사' 탭에서 등록하면\n위기 때 맞춤 경고를 받을 수 있어요.")
            ),
        h(Btn,{onClick:()=>setPhase(2),full:true},"알겠어요, 처방받으러 가기 →"),
        h("button",{onClick:onClose,style:{width:"100%",background:"none",border:"none",color:C.mu,fontSize:13,marginTop:10,padding:"8px",cursor:"pointer"}},"닫기")
      ),

      /* ── Phase 2: 고유명사 처방 선택 ── */
      phase===2&&h("div",{className:"fi"},
        h(Header),
        h("div",{style:{marginBottom:14}},
          h("h2",{style:{fontSize:20,fontWeight:800,color:C.ink,margin:"0 0 4px"}},"당신만을 위한 처방"),
          h("p",{style:{fontSize:13,color:C.sub}},"당신의 데이터가 검증한 처방이에요. 하나를 골라주세요.")
        ),
        cap&&h("div",{style:{background:C.gBg,border:"1px solid "+C.gBd,borderRadius:12,padding:"10px 14px",marginBottom:12,display:"flex",gap:8}},
          h("span",{style:{fontSize:16}},"💌"),
          h("p",{style:{fontSize:12,color:C.ink,margin:0,fontStyle:"italic",lineHeight:1.6,flex:1}},'"'+cap.message+'"')
        ),
        px.map((pr,i)=>h("button",{key:i,onClick:()=>setChosen(i),style:{
          width:"100%",background:chosen===i?C.ac:"#FAFAF9",
          border:"1.5px solid "+(chosen===i?C.p:C.bd),borderRadius:16,
          padding:"14px 16px",display:"flex",gap:14,marginBottom:8,
          cursor:"pointer",textAlign:"left",transition:"all .15s",
          boxShadow:chosen===i?"0 2px 14px rgba(76,100,68,.2)":"none",
        }},
          h("div",{style:{width:40,height:40,borderRadius:11,background:chosen===i?C.p:C.ac,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0,transition:"background .15s"}},pr.icon),
          h("div",{style:{flex:1}},
            h("p",{style:{fontSize:14,fontWeight:700,color:chosen===i?C.pT:C.ink,margin:"0 0 3px"}},pr.t),
            h("p",{style:{fontSize:12,color:C.sub,margin:"0 0 5px",lineHeight:1.5}},pr.dc),
            h("span",{style:{fontSize:10,fontWeight:700,color:C.mu,background:C.bg,borderRadius:6,padding:"2px 7px",border:"1px solid "+C.bd}},pr.ev)
          ),
          chosen===i&&h("span",{style:{color:C.p,fontSize:18,alignSelf:"center"}},"✓")
        )),
        h(Btn,{onClick:()=>setPhase(3),disabled:chosen===null,full:true,style:{marginTop:6}},chosen!==null?"시작하기 →":"처방을 선택해주세요")
      ),

      /* ── Phase 3: 타이머 ── */
      phase===3&&p&&h("div",{className:"fi",style:{textAlign:"center"}},
        h(Header),
        h("div",{style:{fontSize:56,marginBottom:12}},p.icon),
        h("h2",{style:{fontSize:18,fontWeight:800,color:C.ink,marginBottom:6}},p.t),
        h("p",{style:{fontSize:13,color:C.sub,marginBottom:22,lineHeight:1.7}},p.dc),
        h("div",{style:{background:C.ac,borderRadius:20,padding:"28px 24px",marginBottom:24}},
          h("p",{style:{fontSize:11,fontWeight:700,color:C.pT,letterSpacing:"1px",marginBottom:8}},"경과 시간"),
          h("p",{style:{fontSize:56,fontWeight:800,color:C.pT,margin:0,fontVariantNumeric:"tabular-nums",letterSpacing:"-2px"}},
            String(mins).padStart(2,"0")+":"+String(secs).padStart(2,"0")
          ),
          h("p",{style:{fontSize:12,color:C.p,marginTop:8}},elapsed<30?"조금만 더 집중해 보세요 🌿":elapsed<60?"잘 하고 있어요 💚":"훌륭해요! 이제 마무리해도 좋아요 🌱")
        ),
        h(Btn,{onClick:()=>setPhase(4),full:true},"완료했어요 ✓"),
        h("button",{onClick:onClose,style:{width:"100%",background:"none",border:"none",color:C.mu,fontSize:13,marginTop:10,padding:"8px",cursor:"pointer"}},"그냥 닫기")
      ),

      /* ── Phase 4: 피드백 ── */
      phase===4&&h("div",{className:"fi",style:{textAlign:"center"}},
        h(Header),
        h("p",{style:{fontSize:36,marginBottom:10}},"🌿"),
        h("h2",{style:{fontSize:20,fontWeight:800,color:C.ink,marginBottom:6}},"어떠셨나요?"),
        h("p",{style:{fontSize:13,color:C.sub,marginBottom:20}},"솔직한 피드백이 다음 처방을 더 정확하게 만들어요"),
        h("div",{style:{display:"flex",gap:8,justifyContent:"center",marginBottom:22}},
          [{v:1,e:"😞",l:"전혀"},{v:2,e:"😔",l:"별로"},{v:3,e:"🙂",l:"조금"},{v:4,e:"😊",l:"꽤"},{v:5,e:"🤩",l:"최고!"}].map(({v,e,l})=>
            h("button",{key:v,onClick:()=>setScore(v),style:{
              background:score===v?C.ac:"#FAFAF9",
              border:"2px solid "+(score===v?C.p:C.bd),
              borderRadius:14,padding:"12px 8px",cursor:"pointer",
              minWidth:56,display:"flex",flexDirection:"column",alignItems:"center",gap:5,
              transition:"all .15s",transform:score===v?"scale(1.08)":"scale(1)",
              boxShadow:score===v?"0 4px 12px rgba(76,100,68,.2)":"none",
            }},
              h("span",{style:{fontSize:26}},e),
              h("span",{style:{fontSize:11,color:score===v?C.pT:C.mu,fontWeight:score===v?700:500}},l)
            )
          )
        ),
        h(Btn,{onClick:()=>finish(score),disabled:score===null,full:true},"보상 받기 🎁")
      ),

      /* ── Phase 5: 보상 ── */
      phase===5&&h("div",{className:"fi",style:{textAlign:"center"}},
        h("div",{style:{width:32,height:4,background:C.bd,borderRadius:2,margin:"0 auto 20px"}}),
        h("div",{style:{fontSize:52,marginBottom:10}},score>=4?"🎉":score>=3?"🙂":"💪"),
        h("h2",{style:{fontSize:22,fontWeight:800,color:C.ink,marginBottom:6}},
          score>=4?"소름 돋는 효과였군요!":score>=3?"조금 나아졌길 바라요":"오늘은 정말 수고했어요"
        ),
        h("p",{style:{fontSize:13,color:C.sub,marginBottom:20}},"기록이 쌓일수록 처방이 더 정확해져요"),
        /* 게이지 보상 */
        h("div",{style:{background:C.ac,borderRadius:18,padding:"22px",marginBottom:20,textAlign:"left"}},
          h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}},
            h("div",null,
              h("p",{style:{fontSize:11,fontWeight:700,color:C.pT,margin:"0 0 3px",letterSpacing:".5px"}},"회복 탄력성 지수"),
              h("p",{style:{fontSize:28,fontWeight:800,color:C.ink,margin:0,letterSpacing:"-1px"}},newScore,"점")
            ),
            h("div",{style:{background:C.p,borderRadius:20,padding:"5px 12px",display:"flex",alignItems:"center",gap:4}},
              h("span",{style:{fontSize:12,fontWeight:700,color:"#fff"}},"+"+(score>=4?5:score>=3?2:0)+"%"),
              h("span",{style:{fontSize:14}},"🌱")
            )
          ),
          h("div",{style:{height:14,background:"rgba(255,255,255,.5)",borderRadius:7,overflow:"hidden",marginBottom:8}},
            h("div",{style:{
              height:"100%",
              background:"linear-gradient(90deg,"+C.p+","+C.pL+")",
              borderRadius:7,
              width:gaugeAnim?newScore+"%":"0%",
              transition:"width 1.4s cubic-bezier(.22,1,.36,1)",
            }})
          ),
          h("p",{style:{fontSize:11,color:C.p}},
            newScore<40?"초급 레벨 · 자기 이해 시작 🌱":
            newScore<70?"중급 레벨 · 패턴 인식 중 🌿":
            "고급 레벨 · 감정 조절 능숙 🌳"
          )
        ),
        h(AdBanner,{event:"야근"}),
        h(Btn,{onClick:onClose,full:true},"홈으로 돌아가기 💚")
      )
    )
  );
}

/* ══════════════════════════════
   기록 입력 모달 (RecordModal)
   — 과거 성공 매칭 카드 추가
══════════════════════════════ */
function RecordModal({targetDate,data,onSave,onClose}){
  const [step,setStep]=useState(0);
  const [event,setEvent]=useState("");
  const [emotion,setEmo]=useState("");
  const [action,setAction]=useState("");
  const [outcome,setOut]=useState(null);
  const [antiVisible,setAntiVisible]=useState(false);
  const [antiShown,setAntiShown]=useState(false);
  const [ag,setAg]=useState(null);

  const STEPS=["사건","감정","대응","결과"];
  const dateLabel=new Date(targetDate+"T00:00:00").toLocaleDateString("ko-KR",{month:"long",day:"numeric",weekday:"short"});
  const isToday=targetDate===todayISO;

  /* 과거 성공 기록 매칭 */
  const pastWin=findPastWin(data.records,event,emotion);

  const handleEmo=emo=>{
    setEmo(emo);
    if(!antiShown&&NEG_EMOS.includes(emo)&&(data.antiManual||[]).length>0)
      setTimeout(()=>setAntiVisible(true),150);
  };

  const submit=()=>onSave({
    date:targetDate,event,emotion,action,
    outcomeLabel:outcome?.l,outcomeScore:outcome?.s,isSOS:false,
  });

  const em=emoMeta(emotion);
  const overlayBg=emotion
    ?`linear-gradient(180deg,${em.bg} 0%,#FFFFFF 55%)`
    :"linear-gradient(180deg,#EBF0E8 0%,#FFFFFF 55%)";

  return h("div",{style:{position:"fixed",inset:0,background:"rgba(26,35,22,.55)",zIndex:200,display:"flex",flexDirection:"column",justifyContent:"flex-end"},
    onClick:e=>{if(e.target===e.currentTarget)onClose();}},
    h("div",{style:{background:"#fff",borderRadius:"24px 24px 0 0",maxWidth:430,margin:"0 auto",width:"100%",maxHeight:"90vh",overflowY:"auto",backgroundImage:overlayBg,transition:"background-image .4s ease"},className:"su"},
      h("div",{style:{padding:"16px 20px 0"}},
        h("div",{style:{width:32,height:4,background:C.bd,borderRadius:2,margin:"0 auto 14px"}}),
        h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:4}},
          h("div",{style:{display:"flex",alignItems:"center",gap:8}},
            h("span",{style:{fontSize:18}},isToday?"✏":"📅"),
            h("div",null,
              h("p",{style:{fontSize:15,fontWeight:800,color:C.ink,margin:0}},dateLabel),
              h("p",{style:{fontSize:11,color:C.sub,marginTop:2}},"마음의 날씨를 기록해요")
            )
          ),
          h("button",{onClick:onClose,style:{background:"none",border:"none",width:32,height:32,borderRadius:10,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,color:C.mu,cursor:"pointer"}},"×")
        ),
        h("div",{style:{display:"flex",gap:4,marginTop:12}},
          STEPS.map((_,i)=>h("div",{key:i,style:{flex:1,height:3,borderRadius:2,background:i<=step?C.p:C.bd,transition:"background .3s"}}))
        )
      ),

      /* 안티매뉴얼 인라인 경고 */
      antiVisible&&h("div",{style:{margin:"12px 20px 0",background:"#FEF3C7",border:"1.5px solid #FDE68A",borderRadius:14,padding:"14px",position:"relative"},className:"su"},
        h("button",{onClick:()=>{setAntiVisible(false);setAntiShown(true);},style:{position:"absolute",top:8,right:10,background:"none",border:"none",fontSize:16,color:"#92400E",cursor:"pointer"}},"×"),
        h("div",{style:{display:"flex",gap:10,alignItems:"flex-start"}},
          h("span",{style:{fontSize:24,flexShrink:0}},"⚠"),
          h("div",null,
            h("p",{style:{fontSize:12,fontWeight:800,color:"#78350F",margin:"0 0 6px",letterSpacing:".3px"}},"ANTI-MANUAL 발동"),
            h("p",{style:{fontSize:13,color:"#92400E",margin:"0 0 8px",lineHeight:1.6}},"'"+emotion+"' 상태일 때 반복하는 실수들이에요."),
            (data.antiManual||[]).slice(0,3).map((a,i)=>h("p",{key:i,style:{fontSize:12,color:"#78350F",margin:"0 0 3px",fontWeight:700}},"⛔ "+a)),
            h("p",{style:{fontSize:12,color:"#92400E",marginTop:8,fontStyle:"italic"}},"지금 의도적으로 심호흡 3번을 하세요. 🌿")
          )
        )
      ),

      h("div",{style:{padding:"20px 20px 32px"},key:"step"+step,className:"si"},

        /* STEP 0: 사건 + 과거 성공 카드 */
        step===0&&h(Fragment,null,
          h("p",{style:{fontSize:19,fontWeight:800,color:C.ink,marginBottom:4}},"무슨 일이 있었나요?"),
          h("p",{style:{fontSize:13,color:C.sub,marginBottom:14}},"오늘의 상황을 골라주세요"),
          /* 과거 성공 카드 (event 매칭) */
          event&&h(PastWinCard,{
            win:findPastWin(data.records,event,null),
            onUse:()=>{setAction(findPastWin(data.records,event,null)?.action||"");setStep(2);}
          }),
          h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}},
            EVENTS.map(opt=>h("button",{key:opt,onClick:()=>setEvent(opt),style:{
              background:event===opt?C.p:C.sur,color:event===opt?"#fff":C.ink,
              border:"1.5px solid "+(event===opt?C.p:C.bd),borderRadius:12,
              padding:"14px 10px",fontSize:13,fontWeight:event===opt?700:400,
              cursor:"pointer",transition:"all .15s",
            }},opt))
          ),
          h("textarea",{placeholder:"직접 입력...",value:event&&!EVENTS.includes(event)?event:"",
            onChange:e=>{setEvent(e.target.value);e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px";},
            style:{width:"100%",border:"1.5px solid "+C.bd,borderRadius:12,padding:"12px 14px",fontSize:14,background:"rgba(255,255,255,.7)",boxSizing:"border-box",outline:"none",color:C.ink,minHeight:44,lineHeight:1.5,marginBottom:14}}),
          h(Btn,{onClick:()=>setStep(1),disabled:!event,full:true},"다음 →")
        ),

        /* STEP 1: 감정 + 과거 성공 카드 */
        step===1&&h(Fragment,null,
          h("p",{style:{fontSize:19,fontWeight:800,color:C.ink,marginBottom:4}},"어떤 기분이었나요?"),
          h("p",{style:{fontSize:13,color:C.sub,marginBottom:12}},"감정을 고르면 달력 칸이 채색돼요"),
          /* 과거 성공 카드 (emotion 매칭) */
          emotion&&h(PastWinCard,{
            win:findPastWin(data.records,null,emotion),
            onUse:()=>{setAction(findPastWin(data.records,null,emotion)?.action||"");setStep(2);}
          }),
          h("div",{style:{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}},
            h("button",{onClick:()=>setAg(null),style:{fontSize:12,fontWeight:600,padding:"5px 12px",borderRadius:20,border:"1.5px solid "+(ag===null?C.p:C.bd),background:ag===null?C.p:"transparent",color:ag===null?"#fff":C.sub,cursor:"pointer"}},"전체"),
            ECATS.map((cat,i)=>h("button",{key:i,onClick:()=>setAg(ag===i?null:i),style:{fontSize:12,fontWeight:600,padding:"5px 12px",borderRadius:20,border:"1.5px solid "+(ag===i?cat.c:C.bd),background:ag===i?cat.c:"transparent",color:ag===i?"#fff":C.sub,cursor:"pointer"}},cat.g))
          ),
          h("div",{style:{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12}},
            (ag!==null?[ECATS[ag]]:ECATS).map(cat=>cat.ems.map(emo=>{
              const isSel=emotion===emo;
              return h("button",{key:emo,onClick:()=>handleEmo(emo),style:{
                padding:"9px 16px",borderRadius:20,fontSize:13,fontWeight:isSel?700:500,cursor:"pointer",
                background:isSel?cat.c:cat.bg,color:isSel?"#fff":cat.c,
                border:"1.5px solid "+(isSel?cat.c:cat.c+"50"),
                transition:"all .12s",transform:isSel?"scale(1.05)":"scale(1)",
              }},emo);
            }))
          ),
          emotion&&h("div",{style:{background:em.bg,border:"1.5px solid "+em.c+"40",borderRadius:12,padding:"10px 14px",marginBottom:12,display:"flex",alignItems:"center",gap:10},className:"pop"},
            h("div",{style:{width:12,height:12,borderRadius:"50%",background:em.c,flexShrink:0}}),
            h("p",{style:{fontSize:13,fontWeight:700,color:em.c,margin:0}},"'"+emotion+"' — "+em.g+" 컬러로 달력에 채색돼요")
          ),
          h(Btn,{onClick:()=>setStep(2),disabled:!emotion,full:true},emotion?'"'+emotion+'" 완료 →':"감정을 선택해주세요")
        ),

        /* STEP 2: 대응 */
        step===2&&h(Fragment,null,
          h("p",{style:{fontSize:19,fontWeight:800,color:C.ink,marginBottom:4}},"어떻게 행동했나요?"),
          h("p",{style:{fontSize:13,color:C.sub,marginBottom:14}},"그 상황에서 내가 선택한 행동이에요"),
          h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}},
            ACTIONS.map(opt=>h("button",{key:opt,onClick:()=>setAction(opt),style:{
              background:action===opt?C.p:C.sur,color:action===opt?"#fff":C.ink,
              border:"1.5px solid "+(action===opt?C.p:C.bd),borderRadius:12,
              padding:"14px 10px",fontSize:13,fontWeight:action===opt?700:400,
              cursor:"pointer",transition:"all .15s",
            }},opt))
          ),
          h("textarea",{placeholder:"직접 입력...",value:action&&!ACTIONS.includes(action)?action:"",
            onChange:e=>{setAction(e.target.value);e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px";},
            style:{width:"100%",border:"1.5px solid "+C.bd,borderRadius:12,padding:"12px 14px",fontSize:14,background:"rgba(255,255,255,.7)",boxSizing:"border-box",outline:"none",color:C.ink,minHeight:44,lineHeight:1.5,marginBottom:14}}),
          h("div",{style:{display:"flex",gap:8}},
            h(Btn,{onClick:()=>setStep(1),variant:"ghost",style:{flex:.45,padding:"14px"}},"이전"),
            h(Btn,{onClick:()=>setStep(3),disabled:!action,full:true,style:{flex:1}},action?"다음 →":"행동을 선택해주세요")
          )
        ),

        /* STEP 3: 결과 */
        step===3&&h(Fragment,null,
          h("p",{style:{fontSize:19,fontWeight:800,color:C.ink,marginBottom:4}},"그러고 나서 어떻게 됐나요?"),
          h("p",{style:{fontSize:13,color:C.sub,marginBottom:14}},'"'+action+'" 이후의 상태를 골라주세요'),
          OUTCOMES.map(opt=>h("button",{key:opt.l,onClick:()=>setOut(opt),style:{
            width:"100%",background:outcome?.l===opt.l?C.ac:C.sur,
            border:"1.5px solid "+(outcome?.l===opt.l?C.p:C.bd),

/* ══ 온보딩 ══ */
function Onboarding({onDone}){
  const STEPS=[
    {q:"가장 아끼는 애착 물건이 있나요?",ph:"예: 노란 머그컵, 할머니 목도리",f:"attachedItems"},
    {q:"마음이 편해지는 장소는?",ph:"예: 도서관 뒷길, 한강 벤치",f:"favoriteSpots"},
    {q:"자주 마시는 음료는?",ph:"예: 얼그레이, 아이스아메리카노",f:"favoriteDrinks"},
    {q:"스트레스가 풀리는 나만의 방법은?",ph:"예: 강아지 사진 보기, 산책",f:"happyConditions"},
  ];
  const [step,setStep]=useState(0);
  const [vals,setVals]=useState(["","","",""]);
  const s=STEPS[step],isLast=step===STEPS.length-1;
  const next=()=>{
    if(isLast){const r={};STEPS.forEach((st,i)=>{if(vals[i].trim())r[st.f]=[vals[i].trim()];});onDone(r);}
    else setStep(step+1);
  };
  return h("div",{style:{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",justifyContent:"center",padding:"32px 20px"}},
    h("div",{style:{textAlign:"center",marginBottom:28}},
      h("div",{style:{width:52,height:52,borderRadius:14,background:C.ac,display:"flex",alignItems:"center",justifyContent:"center",fontSize:24,margin:"0 auto 10px"}},"📖"),
      h("h1",{style:{fontSize:22,fontWeight:800,color:C.ink,marginBottom:6}},"나 사용 설명서"),
      h("p",{style:{fontSize:13,color:C.sub}},"처방을 개인화하기 위한 기본 정보예요")
    ),
    h("div",{style:{background:C.sur,borderRadius:20,padding:"24px 20px",border:"1px solid "+C.bd},className:"su",key:"ob"+step},
      h("div",{style:{display:"flex",gap:4,marginBottom:18}},STEPS.map((_,i)=>h("div",{key:i,style:{flex:1,height:3,borderRadius:2,background:i<=step?C.p:C.bd,transition:"background .3s"}}))),
      h("p",{style:{fontSize:11,fontWeight:600,color:C.mu,marginBottom:6,letterSpacing:".3px"}},(step+1)+" / "+STEPS.length),
      h("h2",{style:{fontSize:18,fontWeight:700,color:C.ink,marginBottom:14}},s.q),
      h("input",{value:vals[step],onChange:e=>{const n=[...vals];n[step]=e.target.value;setVals(n);},onKeyDown:e=>{if(e.key==="Enter"&&vals[step].trim())next();},placeholder:s.ph,autoFocus:true,style:{width:"100%",border:"1.5px solid "+(vals[step]?C.p:C.bd),borderRadius:12,padding:"13px 14px",fontSize:14,background:C.bg,boxSizing:"border-box",outline:"none",color:C.ink,transition:"border .15s"}}),
      h("p",{style:{fontSize:12,color:C.mu,marginTop:6,marginBottom:16}},"없으면 건너뛰어도 괜찮아요"),
      h("div",{style:{display:"flex",gap:8}},
        step>0&&h(Btn,{onClick:()=>setStep(step-1),variant:"ghost",style:{flex:.5,padding:"13px 16px"}},"이전"),
        h(Btn,{onClick:next,full:true,style:{flex:1}},isLast?"시작하기 →":"다음")
      )
    )
  );
}

/* ══════════════════════════════
   APP — LocalStorage 동기화
══════════════════════════════ */
function App(){
  const [data,setData]=useState(loadData);
  const [page,setPage]=useState("home");
  const [sos,setSos]=useState(false);

  const update=useCallback(patch=>{
    setData(prev=>{
      const next={...prev,...patch};
      saveData(next);
      return next;
    });
  },[]);

  if(!data.onboarded)return h(Onboarding,{onDone:extra=>update({...extra,onboarded:true})});

  return h("div",{style:{fontFamily:"'Apple SD Gothic Neo','Pretendard',-apple-system,sans-serif",background:C.bg,maxWidth:430,margin:"0 auto",minHeight:"100vh",position:"relative"}},
    page==="home"   &&h(HomePage,   {data,go:setPage,onSos:()=>setSos(true)}),
    page==="record" &&h(RecordPage, {data,onUpdate:update,go:setPage}),
    page==="history"&&h(HistoryPage,{data,go:setPage,onUpdate:update}),
    sos&&h(SOSModal,{data,onClose:()=>setSos(false),onUpdate:update}),
    !sos&&page!=="record"&&h(Nav,{page,go:setPage}),
    page==="record"&&h(Nav,{page,go:setPage})
  );
}
ReactDOM.createRoot(document.getElementById("app")).render(h(App));
